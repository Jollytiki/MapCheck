[workspace]
resolver = "2"
members = ["crates/mapcheck-app", "crates/mapcheck-core", "crates/mapcheck-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "ISC"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keeps the distributable `mapcheck` binary small.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
