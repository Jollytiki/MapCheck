[package]
name = "mapcheck-wasm"
description = "wasm-bindgen shim exposing mapcheck-core to the browser app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mapcheck-core = { path = "../mapcheck-core" }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"

[package.metadata.wasm-pack.profile.release]
# Current rustc emits these wasm features by default; wasm-opt validates
# without them unless they are named explicitly.
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-reference-types",
]
